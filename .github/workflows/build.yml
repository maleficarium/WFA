name: Build Windows exe
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pyinstaller
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name WoWAddonUpdater-GitHub addon_updater.py
      - name: Smoke test (start the exe once on Windows)
        shell: pwsh
        timeout-minutes: 3
        run: |
          $p = Start-Process -FilePath dist\WoWAddonUpdater-GitHub.exe -ArgumentList '--selftest' -Wait -PassThru
          Write-Host "exit code $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Live check against GitHub (informational, never fails the build)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/live_check.py
      - uses: actions/upload-artifact@v4
        with:
          name: WoWAddonUpdater-GitHub
          path: dist/WoWAddonUpdater-GitHub.exe
